[package]
name = "tpt-av-cadence-wav"
description = "RIFF/WAVE parser with PCM/IEEE-float decoder and encoder for the tpt-cadence audio codec suite."
readme = "README.md"
keywords = ["audio", "wav", "pcm", "codec", "decoder"]
categories = ["multimedia::audio", "multimedia::encoding", "parser-implementations"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
tpt-av-cadence-core = { workspace = true }
byteorder = { workspace = true }
log = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
tpt-av-cadence-test-utils = { workspace = true }
tpt-av-test-fuzz = { path = "../../tpt-av-test/tpt-av-test-fuzz" }
criterion = { workspace = true }

[[bench]]
name = "decode"
harness = false
