[package]
name = "tpt-av-cadence-opus"
description = "Opus (RFC 6716) decoder and encoder (CELT, SILK, and hybrid) with Ogg Opus (RFC 7845) support, for the tpt-cadence audio codec suite."
readme = "README.md"
keywords = ["audio", "opus", "codec", "decoder"]
categories = ["multimedia::audio", "multimedia::encoding"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
tpt-av-cadence-core = { workspace = true }
tpt-av-cadence-ogg = { workspace = true }
log = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
criterion = { workspace = true }
tpt-av-cadence-test-utils = { path = "../tpt-av-cadence-test-utils" }

[[bench]]
name = "celt_round_trip"
harness = false

[[bench]]
name = "silk_round_trip"
harness = false
