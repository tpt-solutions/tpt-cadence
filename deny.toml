# cargo-deny configuration for tpt-cadence.
#
# The project's core tenet is a purely permissive dependency tree: no GPL,
# LGPL, AGPL, or MPL may appear anywhere in the graph. Run with:
#
#   cargo deny check licenses

[graph]
all-features = true

[licenses]
version = 2

# Everything we allow, everything transitively pulled in must be on this
# list. Anything NOT on it (GPL/LGPL/AGPL/MPL and every other license) is
# denied by default — cargo-deny removed the explicit `deny` key.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    # unicode-ident (transitive via thiserror/proc-macro2 toolchain crates)
    "Unicode-3.0",
    "Unicode-DFS-2016",
]

confidence-threshold = 0.93
