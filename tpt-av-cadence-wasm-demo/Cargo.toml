[package]
name = "tpt-av-cadence-wasm-demo"
description = "WASM smoke demo for the tpt-cadence decoder crates: decodes the bytes of every supported format to f32 PCM via wasm-bindgen. Proves the decoder crates compile and run correctly under wasm32-unknown-unknown — not a general-purpose API."
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
tpt-av-cadence-core = { workspace = true }
tpt-av-cadence-wav = { path = "../tpt-av-cadence-wav" }
tpt-av-cadence-aiff = { path = "../tpt-av-cadence-aiff" }
tpt-av-cadence-flac = { path = "../tpt-av-cadence-flac" }
tpt-av-cadence-mp3 = { path = "../tpt-av-cadence-mp3" }
tpt-av-cadence-aac = { path = "../tpt-av-cadence-aac" }
tpt-av-cadence-opus = { path = "../tpt-av-cadence-opus" }
tpt-av-cadence-vorbis = { path = "../tpt-av-cadence-vorbis" }
wasm-bindgen = "0.2"

# Host-side only (fixture generation in tests/gen_fixtures.rs; never built
# for the wasm32 target).
[dev-dependencies]
tpt-av-cadence-flac = { path = "../tpt-av-cadence-flac" }
tpt-av-cadence-mp3 = { path = "../tpt-av-cadence-mp3" }
tpt-av-cadence-opus = { path = "../tpt-av-cadence-opus" }
tpt-av-cadence-vorbis = { path = "../tpt-av-cadence-vorbis" }
