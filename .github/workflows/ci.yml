name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Nightly fuzz run (03:00 UTC) — see the `fuzz` job below.
    - cron: "0 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable, "1.75"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-build
        with:
          toolchain: ${{ matrix.rust }}

      - name: Run tests
        # Builds lib/test/example targets itself; bench targets are
        # compile-checked by the dedicated `bench` job.
        run: cargo test --workspace

      # Proves tpt-av-cadence-cli's per-format feature flags actually gate
      # out the corresponding decoder crate (not just "the flag exists") —
      # a handful of representative single-format and zero-format builds,
      # not the full 2^7 combination matrix.
      - name: Check per-format CLI feature combinations
        if: matrix.os == 'ubuntu-latest' && matrix.rust == 'stable'
        run: |
          cargo build -p tpt-av-cadence-cli --no-default-features --features wav
          cargo build -p tpt-av-cadence-cli --no-default-features --features flac
          cargo build -p tpt-av-cadence-cli --no-default-features --features opus
          cargo build -p tpt-av-cadence-cli --no-default-features --features vorbis
          cargo build -p tpt-av-cadence-cli --no-default-features --features wav,flac
          cargo build -p tpt-av-cadence-cli --no-default-features

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-build
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  license-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # cargo-deny parses the full workspace manifest, including
      # tpt-av-cadence-test-utils's path dependency on tpt-av-test-reference,
      # so the sibling repo must be present even though this job never
      # builds any code.
      - uses: ./.github/actions/setup-build
        with:
          toolchain: stable
          cache: "false"

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: cargo-deny license audit
        run: cargo deny check licenses

  # Builds tpt-av-cadence-wasm-demo for wasm32-unknown-unknown and runs its
  # Node.js smoke test through the generated wasm-bindgen bindings — proves
  # the decoder crates actually decode correctly under wasm, not just that
  # they compile. See tpt-av-cadence-wasm-demo/src/lib.rs's doc comment.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-build
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Build wasm32 demo
        run: cargo build -p tpt-av-cadence-wasm-demo --target wasm32-unknown-unknown --release

      - name: Resolve wasm-bindgen crate version from Cargo.lock
        id: wasm_bindgen_version
        run: |
          version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | grep version | head -1 | cut -d'"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install wasm-bindgen-cli (pinned to the resolved wasm-bindgen crate version)
        uses: taiki-e/install-action@v2
        with:
          # The CLI must stay in lockstep with the wasm-bindgen crate version
          # resolved in Cargo.lock (bindings generation is version-paired).
          tool: wasm-bindgen-cli@${{ steps.wasm_bindgen_version.outputs.version }}

      - name: Generate JS bindings
        run: wasm-bindgen target/wasm32-unknown-unknown/release/tpt_av_cadence_wasm_demo.wasm --out-dir tpt-av-cadence-wasm-demo/pkg --target nodejs

      - name: Install wasm-opt (binaryen)
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-opt

      - name: Optimize wasm size (wasm-opt -Oz)
        working-directory: tpt-av-cadence-wasm-demo/pkg
        run: |
          # wasm-bindgen --target nodejs emits <name>_bg.wasm
          wasm=tpt_av_cadence_wasm_demo_bg.wasm
          before=$(stat -c%s "$wasm")
          echo "wasm-bindgen output: $before bytes"
          wasm-opt -Oz -o "$wasm.opt" "$wasm"
          mv "$wasm.opt" "$wasm"
          after=$(stat -c%s "$wasm")
          echo "wasm-opt -Oz output:  $after bytes"
          echo "wasm size: $before -> $after bytes ($(( 100 - after * 100 / before ))% smaller)"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Node smoke test
        working-directory: tpt-av-cadence-wasm-demo
        run: node test.js

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-build
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage
        # The counting-allocator RT-safety tests are skipped here: llvm-cov's
        # profile runtime itself allocates on first execution of new code
        # paths, which they would misattribute to the decoder. They still run
        # in the build-and-test job.
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info -- --skip allocation_free

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false

      - name: Upload lcov as artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov-${{ github.sha }}
          path: lcov.info

  # Compile-checks every criterion bench on every push/PR (catches API drift
  # immediately) and, on push to master or manual dispatch only, actually
  # runs them and uploads the result as a build artifact for historical
  # comparison — there's no `gh-pages`/history-tracking wired up yet (see
  # todo.md's "Benchmark tracking" entry), so today "tracking" means "every
  # master-branch run's numbers are downloadable and diffable by hand".
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-build
        with:
          toolchain: stable

      - name: Compile-check all benches
        run: cargo bench --workspace --no-run

      - name: Run benches
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        # `cargo bench --workspace` also invokes each crate's plain lib
        # unittest binary (not just its `[[bench]]` target), and that
        # binary's default libtest harness doesn't understand criterion's
        # `--output-format` flag — so each `[[bench]]` target is run
        # explicitly by name instead of blanket `--workspace`.
        run: |
          set -e
          : > bench-output.txt
          cargo bench -p tpt-av-cadence-wav --bench decode -- --output-format bencher | tee -a bench-output.txt
          cargo bench -p tpt-av-cadence-aiff --bench decode -- --output-format bencher | tee -a bench-output.txt
          cargo bench -p tpt-av-cadence-pcm --bench decode -- --output-format bencher | tee -a bench-output.txt
          cargo bench -p tpt-av-cadence-flac --bench decode -- --output-format bencher | tee -a bench-output.txt
          cargo bench -p tpt-av-cadence-flac --bench encode -- --output-format bencher | tee -a bench-output.txt
          cargo bench -p tpt-av-cadence-mp3 --bench decode -- --output-format bencher | tee -a bench-output.txt
          cargo bench -p tpt-av-cadence-mp3 --bench encode -- --output-format bencher | tee -a bench-output.txt
          cargo bench -p tpt-av-cadence-aac --bench decode -- --output-format bencher | tee -a bench-output.txt
          cargo bench -p tpt-av-cadence-vorbis --bench decode -- --output-format bencher | tee -a bench-output.txt
          cargo bench -p tpt-av-cadence-vorbis --bench encode -- --output-format bencher | tee -a bench-output.txt
          cargo bench -p tpt-av-cadence-opus --bench celt_round_trip -- --output-format bencher | tee -a bench-output.txt
          cargo bench -p tpt-av-cadence-opus --bench silk_round_trip -- --output-format bencher | tee -a bench-output.txt

      - name: Upload bench results
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: bench-results-${{ github.sha }}
          path: bench-output.txt

  # Generates the human-readable conformance dashboard (tools/conformance_dashboard.py)
  # from the same conformance-test output the crates already print, and uploads it
  # as a build artifact. Not run on every push/PR (it re-runs each crate's whole
  # conformance suite in release mode, which is redundant with `build-and-test`) —
  # push-to-master and manual dispatch only. `ubuntu-latest` ships FFmpeg
  # preinstalled, so the FFmpeg-oracle SNR numbers (MP3/AAC/Vorbis) populate here
  # even though they don't in an environment without FFmpeg on PATH.
  conformance-dashboard:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-build
        with:
          toolchain: stable

      - name: Generate conformance dashboard
        run: python3 tools/conformance_dashboard.py --output CONFORMANCE.md

      - name: Upload dashboard
        uses: actions/upload-artifact@v4
        with:
          name: conformance-dashboard-${{ github.sha }}
          path: CONFORMANCE.md

  # Nightly (scheduled) fuzz sweep. Also runs on manual dispatch, but not on
  # every push/PR — each target gets a fixed time budget rather than gating
  # normal CI latency on fuzzing. No rust-cache here: cargo-fuzz builds in
  # `fuzz/target` with a nightly toolchain, which would churn the cache.
  fuzz:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aac_adts
          - aiff_decode
          - flac_decode
          - mp3_decode
          - ogg_pages
          - opus_decode
          - opus_ogg_decode
          - opus_packet
          - vorbis_stream
          - wav_decode
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      # taiki-e/install-action depends on the tool publishing a prebuilt
      # binary for the runner's platform; a missing binary has been observed
      # to leave `cargo fuzz` absent from PATH without failing the install
      # step. This makes that failure loud instead of an empty sweep.
      - name: Verify cargo-fuzz is on PATH
        run: cargo fuzz --version

      - name: Restore corpus cache
        uses: actions/cache@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      - name: Fuzz ${{ matrix.target }} (5 min)
        working-directory: fuzz
        run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=300

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
