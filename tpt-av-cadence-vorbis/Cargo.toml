[package]
name = "tpt-av-cadence-vorbis"
description = "Ogg Vorbis I decoder and encoder for the tpt-cadence audio codec suite."
readme = "README.md"
# The f32 reference decodes (~12 MB) would push the tarball past crates.io's 10 MiB limit; they stay in the repo.
exclude = ["tests/data/*.ref"]
keywords = ["audio", "vorbis", "ogg", "codec", "decoder"]
categories = ["multimedia::audio", "multimedia::encoding"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
tpt-av-cadence-core = { workspace = true }
tpt-av-cadence-ogg = { workspace = true }
log = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
tpt-av-cadence-test-utils = { workspace = true }

[[bench]]
name = "decode"
harness = false
